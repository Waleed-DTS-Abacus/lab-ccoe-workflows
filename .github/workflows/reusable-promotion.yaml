
name: Reusable Promotion Validation

on:
  workflow_call:
    inputs:
      dev_branch:
        description: Development branch
        required: true
        type: string

      uat_branch:
        description: UAT branch
        required: true
        type: string

      prod_branch:
        description: Production branch
        required: true
        type: string

jobs:
  validate-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Promotion Path
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          DEV_BRANCH: ${{ inputs.dev_branch }}
          UAT_BRANCH: ${{ inputs.uat_branch }}
          PROD_BRANCH: ${{ inputs.prod_branch }}
        run: |
          set -euo pipefail

          echo "Source: $SOURCE_BRANCH"
          echo "Target: $TARGET_BRANCH"

          if [[ -z "$SOURCE_BRANCH" || -z "$TARGET_BRANCH" ]]; then
            echo "FAIL: Pull Request context is required"
            exit 1
          fi

          if [[ "$TARGET_BRANCH" == "$UAT_BRANCH" &&
                "$SOURCE_BRANCH" == "$DEV_BRANCH" ]]; then
            echo "PASS: Development to UAT promotion allowed"

          elif [[ "$TARGET_BRANCH" == "$PROD_BRANCH" &&
                  "$SOURCE_BRANCH" == "$UAT_BRANCH" ]]; then
            echo "PASS: UAT to Production promotion allowed"

          else
            echo "FAIL: Unauthorized promotion path"
            exit 1
          fi
