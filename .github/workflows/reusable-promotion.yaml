
name: Reusable Promotion Validation

on:
  workflow_call:

jobs:
  validate-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Show Pull Request Branches
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Source Branch: $SOURCE_BRANCH"
          echo "Target Branch: $TARGET_BRANCH"

          if [[ "$TARGET_BRANCH" == "moj-uat" ]]; then
            if [[ "$SOURCE_BRANCH" == "main" ]]; then
              echo "PASS: Promotion from main to UAT is allowed"
            else
              echo "FAIL: Only main can be promoted to UAT"
              exit 1
            fi
          fi

          if [[ "$TARGET_BRANCH" == "moj" ]]; then
            if [[ "$SOURCE_BRANCH" == "moj-uat" ]]; then
              echo "PASS: Promotion from UAT to Production is allowed"
            else
              echo "FAIL: Only moj-uat can be promoted to Production"
              exit 1
            fi
          fi
